  <circle cx="400" cy="34" r="6" fill="#E8C35A" opacity=".8"/>
  <circle cx="400" cy="20" r="5" fill="#E8C35A" opacity=".8"/>
  <circle cx="400" cy="9" r="3.5" fill="#E8C35A" opacity=".8"/>
  <!-- a palm on the left -->
  <path d="M520 392 C522 330 518 270 512 230" fill="none" stroke="#9A5236" stroke-width="7" opacity=".4"/>
  <path d="M512 228 C490 214 470 214 452 226 C474 220 494 224 510 234 Z M512 228 C532 210 556 210 574 222 C552 218 532 222 514 234 Z M512 226 C506 204 512 186 528 176 C520 194 518 210 516 228 Z" fill="#6E8F7A" opacity=".5"/>
