  <circle cx="172" cy="268" r="15" fill="#fff" stroke-width="1.7"/>
  <circle cx="130" cy="271" r="7" fill="#2a2520" stroke="none"/>
  <circle cx="168" cy="271" r="7" fill="#2a2520" stroke="none"/>
  <circle cx="132" cy="267" r="2.4" fill="#fff" stroke="none"/>
  <circle cx="170" cy="267" r="2.4" fill="#fff" stroke="none"/>
  <!-- the smile -->
  <path d="M124 312 C136 328 160 328 172 312" stroke-width="1.8"/>
  <!-- headlamp and bumper -->
  <circle cx="54" cy="310" r="8" stroke-width="1.3"/>
  <path d="M40 342 L72 342" stroke-width="1.1"/>
  <!-- wheels -->
  <circle cx="96" cy="366" r="24" stroke-width="1.8"/>
  <circle cx="290" cy="366" r="24" stroke-width="1.8"/>
  <circle cx="96" cy="366" r="8" stroke-width="1.1"/>
  <circle cx="290" cy="366" r="8" stroke-width="1.1"/>
