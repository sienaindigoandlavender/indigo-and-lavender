  <path d="M40 352 L40 318 C40 306 48 300 62 296 L96 288 C108 262 120 244 136 234 C140 232 146 230 152 230 L316 230 C326 230 334 238 334 248 L334 352 C334 360 328 366 320 366 L54 366 C46 366 40 360 40 352 Z" fill="#3B4A6B" opacity=".55"/>
  <!-- windows -->
  <path d="M102 290 C112 268 124 252 140 244 L196 244 L196 290 Z M206 244 L254 244 L254 290 L206 290 Z M264 244 L322 244 L322 290 L264 290 Z" fill="#EADFD1" opacity=".85"/>
  <!-- cheek -->
  <ellipse cx="110" cy="314" rx="11" ry="6" fill="#D9826B" opacity=".55"/>
  <!-- wheels -->
  <circle cx="96" cy="366" r="24" fill="#2a2520" opacity=".55"/>
  <circle cx="290" cy="366" r="24" fill="#2a2520" opacity=".55"/>
  <!-- the ground -->
  <path d="M40 394 C200 392 400 396 560 394 L570 410 L30 410 Z" fill="#EADFD1" opacity=".9"/>
</g>
<g fill="none" stroke="#2a2520" stroke-linecap="round" stroke-linejoin="round" filter="url(#ink)">
