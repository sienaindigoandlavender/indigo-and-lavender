  <path d="M400 44 L400 4" stroke-width="1"/>
  <circle cx="400" cy="34" r="6" stroke-width="1.1"/>
  <circle cx="400" cy="20" r="5" stroke-width="1.1"/>
  <circle cx="400" cy="9" r="3.5" stroke-width="1"/>
