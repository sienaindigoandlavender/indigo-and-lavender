  <path d="M512 228 C490 214 470 214 452 226 M512 228 C532 210 556 210 574 222 M512 226 C506 204 512 186 528 176 M512 230 C496 236 484 250 480 264 M514 230 C532 238 544 252 548 266" stroke-width="1.1"/>
  <!-- the van: one long body, a short sloping nose -->
  <path d="M40 352 L40 318 C40 306 48 300 62 296 L96 288 C108 262 120 244 136 234 C140 232 146 230 152 230 L316 230 C326 230 334 238 334 248 L334 352 C334 360 328 366 320 366 L54 366 C46 366 40 360 40 352 Z" stroke-width="2"/>
  <path d="M102 290 C112 268 124 252 140 244 L196 244 L196 290 Z" stroke-width="1.4"/>
  <path d="M206 244 L254 244 L254 290 L206 290 Z M264 244 L322 244 L322 290 L264 290 Z" stroke-width="1.3"/>
